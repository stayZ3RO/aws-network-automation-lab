      protocol: tcp
      from_port: 0
      to_port: 65535
      cidr: 0.0.0.0/0
  db-sg:
    - direction: ingress
      protocol: tcp
      from_port: 5432
      to_port: 5432
      cidr: 10.30.0.0/24
